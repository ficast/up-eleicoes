<!doctype html>
<!-- Fonte da imagem de compartilhamento (public/og.png). Gerar com: npm run og -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,800;1,800&family=Barlow:wght@400&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #CCC5BC; color: #000; font-family: 'Barlow', sans-serif; box-sizing: border-box; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  img { height: 150px; width: auto; display: block; align-self: flex-start; }
  h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 116px; line-height: 0.88; margin: 0; letter-spacing: -1px; }
  .n { display: inline-block; background: #FFC107; padding: 0 14px; font-style: italic; }
  .rodape { display: flex; justify-content: space-between; align-items: center; gap: 32px; font-size: 26px; }
  .url { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; border: 3px solid #000; padding: 6px 16px; background: #fff; }
</style>
</head>
<body>
  <img src="../../public/brand/up-logo-black.svg" alt="">
  <h1>A UP na<br>Guerra Eleitoral <span class="n">80</span></h1>
  <div class="rodape">
    <span>Votos da Unidade Popular · 2020 a 2026 · Brasil e exterior</span>
    <span class="url">up-eleicoes.vercel.app</span>
  </div>
</body>
</html>
